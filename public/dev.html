<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dev controls — Up the River, Down the River</title>
<link rel="stylesheet" href="styles.css">
<style>
  body{padding-bottom:0}
  .devwrap{display:flex;flex-direction:column;gap:12px;padding:12px;max-width:none}

  /* The band: every control, over the screens. Two rows -- the table row
     (which table, and the others to hop to) and the game row (where in the
     game, and the one-shots). */
  .band{display:flex;flex-direction:column;gap:9px;padding:10px 12px}
  .bandrow{display:flex;align-items:center;gap:10px;min-width:0}
  .bandrow .code{font-size:20px;font-weight:800;letter-spacing:.14em;color:var(--gold);flex:none}
  .bandsep{width:1px;align-self:stretch;background:var(--line);flex:none}
  .bandlbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-dim);font-weight:700;flex:none}

  .tablestrip{display:flex;gap:6px;overflow-x:auto;min-width:0;flex:1}
  .trow{display:flex;gap:7px;align-items:baseline;flex:none;font-size:12px;padding:5px 9px;text-align:left}
  .trow .tcode{font-weight:800;letter-spacing:.08em;color:var(--gold)}
  .trow .twhat{color:var(--ink-dim);white-space:nowrap}
  .trow .tkind{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-dim)}
  .trow.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(184,134,43,.22)}

  .newtable{display:flex;gap:6px;align-items:center;flex:none}
  .newtable input{width:44px;font:inherit;padding:6px;border-radius:8px;border:1px solid var(--line);
    background:var(--bg);color:var(--ink);text-align:center}

  /* The scrubber: the whole card as cells. Click a round and the game is
     played up to it; the ends are the lobby and the finish. */
  .scrub{display:flex;gap:3px;overflow-x:auto;min-width:0;flex:1}
  .scell{flex:none;min-width:30px;padding:4px 5px;border:1px solid var(--line);border-radius:8px;
    background:var(--bg2);color:var(--ink);font-size:12px;font-weight:650;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.1}
  .scell small{font-size:9px;color:var(--ink-dim);font-weight:600}
  .scell:hover{background:var(--chip)}
  .scell.played{background:rgba(31,122,77,.14)}
  .scell.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(184,134,43,.22)}
  .seg{display:flex;flex:none;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg .btn{border:0;border-radius:0;padding:6px 10px;font-size:12px}
  .seg .btn.on{background:var(--felt);color:#fff}

  .oneshots{display:flex;gap:6px;flex:none;flex-wrap:wrap}
  .oneshots .btn{padding:6px 9px;font-size:12px}

  .live-note{color:var(--red);font-weight:650;margin:0 2px}
  body.livemode .topbar{background:linear-gradient(90deg,#5c1a12,#8d2a1c)}

  /* The screens, full width under the band. */
  .frames{display:flex;flex-direction:column;gap:12px;min-width:0}
  .frameset{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
  .frame{flex:none;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg2);box-shadow:var(--shadow)}
  .frame > header{display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:5px 9px;font-size:12px;font-weight:700;background:var(--chip);color:var(--ink-dim)}
  .frame.captain{border-color:var(--gold);box-shadow:0 0 0 2px rgba(184,134,43,.22), var(--shadow)}
  .frame.captain > header{background:rgba(184,134,43,.22);color:var(--gold)}
  .frame > header a{color:var(--gold);text-decoration:none}
  .frame .shell{position:relative;overflow:hidden}
  .frame iframe{border:0;display:block;transform-origin:top left;background:var(--bg)}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="pip">🛠</span>
    <div>
      <h1>Dev controls</h1>
      <p class="sub" id="subtitle">setting up…</p>
    </div>
  </div>
  <div class="topbar-actions">
    <label class="field inline" style="color:#f3efe2">
      <span style="font-size:11px">preview</span>
      <select id="scale">
        <option value="0.5">50%</option>
        <option value="0.65" selected>65%</option>
        <option value="0.8">80%</option>
        <option value="1">100%</option>
      </select>
    </label>
    <button class="btn ghost" id="btn-theme" type="button" title="Toggle theme">◐</button>
  </div>
</header>

<div class="devwrap">
  <div class="panel band">
    <div class="bandrow">
      <span class="code" id="code">····</span>
      <span class="tally" id="phase">—</span>
      <span class="bandsep"></span>
      <span class="bandlbl">Tables</span>
      <div class="tablestrip" id="tablelist"></div>
      <button class="btn ghost" id="btn-tables" type="button" title="Look again">⟳</button>
      <span class="bandsep"></span>
      <span class="newtable">
        <input type="number" id="players" min="2" max="8" value="4" title="Players at the next new table">
        <button class="btn primary" id="btn-rebuild" type="button">New table</button>
      </span>
    </div>
    <div class="bandrow">
      <span class="bandlbl">Go to</span>
      <div class="scrub" id="scrub"></div>
      <div class="seg" id="goto-phase">
        <button class="btn on" data-phase="bid" type="button" title="Land the round at its bids">bid</button>
        <button class="btn" data-phase="tricks" type="button" title="Land the round with its bids in">tricks</button>
      </div>
      <span class="bandsep"></span>
      <div class="oneshots">
        <button class="btn" data-act="fillBids" type="button">Fill bids</button>
        <button class="btn" data-act="fillTricks" type="button">Fill tricks</button>
        <button class="btn" data-act="nextRound" type="button" title="Play this round through">Play round</button>
        <button class="btn" data-act="bumVote" type="button">Bum deal vote</button>
        <button class="btn" data-act="randomise" type="button">Randomise</button>
        <button class="btn" id="btn-avatars" type="button" title="A stand-in photo on every seat">Photos</button>
        <button class="btn" id="btn-no-avatars" type="button">No photos</button>
      </div>
    </div>
  </div>

  <p class="err" id="dev-err" hidden></p>
  <p class="hint live-note" id="live-note" hidden>
    Real players may be at this table, and every control here lands on their game.
    The phones are watching windows — they show what each player sees without
    putting anybody at the table.
  </p>

  <div class="frames">
    <div class="frameset" id="host-frame"></div>
    <div class="frameset" id="seat-frames"></div>
  </div>
</div>

<script src="/game.js"></script>
<script src="ui.js"></script>
<script src="avatar.js"></script>
<script src="dev.js"></script>
</body>
</html>
