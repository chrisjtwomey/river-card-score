<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Past games — Up the River, Down the River</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar" data-back="index.html" data-back-name="Front page">
  <div class="brand">
    <span class="pip">♠</span>
    <div>
      <h1>Past games</h1>
      <p class="sub" id="subtitle">Swipe to look back</p>
    </div>
  </div>
  <div class="topbar-actions">
    <button class="btn ghost icon" id="btn-settings" type="button" title="Settings"
        aria-label="Settings"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="4.1" width="16" height="1.8" rx=".9"/><rect x="2" y="9.1" width="16" height="1.8" rx=".9"/><rect x="2" y="14.1" width="16" height="1.8" rx=".9"/><circle cx="13.5" cy="5" r="2.6"/><circle cx="6.5" cy="10" r="2.6"/><circle cx="15" cy="15" r="2.6"/></svg></button>
  </div>
</header>

<main>

  <section class="panel" id="empty" hidden>
    <h2>Nothing here yet</h2>
    <p class="hint">A game is kept on this device the moment it ends. Play one and it will be waiting here.</p>
    <p class="hint">Cleared this device, or playing on a new one? Type the table code and take the game back off the table.</p>
    <label class="field">
      <span>Table code</span>
      <input type="text" id="in-code" maxlength="4" autocapitalize="characters" autocomplete="off" placeholder="4F2K" class="code-input">
    </label>
    <button class="btn" id="btn-fetch" type="button">Look on the table</button>
    <p class="err" id="fetch-err" hidden></p>
    <div class="seatlist" id="found"></div>
  </section>

  <div class="deck-nav" id="nav" hidden>
    <button class="btn ghost" id="btn-prev" type="button" aria-label="Newer game">‹</button>
    <span class="deck-count" id="count">1 of 1</span>
    <button class="btn ghost" id="btn-next" type="button" aria-label="Older game">›</button>
  </div>

  <div class="gamedeck" id="deck" hidden tabindex="0" aria-label="Past games, one per screen"></div>

</main>

<script src="/game.js"></script>
<script src="ui.js"></script>
<script src="settings.js"></script>
<script src="accolades.js"></script>
<script src="games.js"></script>
<script src="table.js"></script>
<script src="history.js"></script>
</body>
</html>
