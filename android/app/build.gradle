apply plugin: 'com.android.application'

/* The version comes from the tag that built it. 'v1.2.3' and '1.2.3' are the
   same version, and a release candidate keeps its own name: v1.2.3-rc.1.

   versionCode is one number that must never go down, so the three parts of the
   version make it: 1.2.3 -> 10203. A build with no version given is 'dev' and
   code 1, which is fine for a debug APK and never released. */
def rawVersion = (project.findProperty('appVersion') ?: System.getenv('APP_VERSION') ?: 'dev').toString().trim()
def appVersion = rawVersion.replaceFirst(/^v/, '') ?: 'dev'
def appVersionCode = 1
def numbers = (appVersion =~ /^(\d+)\.(\d+)\.(\d+)/)
if (numbers.find()) {
  appVersionCode = numbers.group(1).toInteger() * 10000 +
                   numbers.group(2).toInteger() * 100 +
                   numbers.group(3).toInteger()
}

android {
  namespace 'com.chrisjtwomey.rivertable'
  compileSdk 35
  // Override with -PndkVersion=... if the build machine has another one.
  ndkVersion project.findProperty('ndkVersion') ?: '27.2.12479018'

  defaultConfig {
    applicationId 'com.chrisjtwomey.rivertable'
    minSdk 24
    targetSdk 35
    // The tag is the version: the workflow passes -PappVersion=v1.2.3, and a
    // build without one is 'dev'. versionCode must never go down, or Android
    // refuses the update, so it is worked out from the numbers in the tag.
    versionCode appVersionCode
    versionName appVersion
    // Only the ABIs the shared library ships, and only what a modern phone
    // uses. Each libnode.so is about 60 MB, so every extra ABI is 60 MB of APK.
    ndk { abiFilters 'arm64-v8a' }
    externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared' } }
  }

  externalNativeBuild { cmake { path 'CMakeLists.txt' } }

  // libnode.so and the node project are fetched by tools/prepare.sh, not held
  // in git: the library alone is 60 MB.
  sourceSets { main { jniLibs.srcDirs 'libnode/bin' } }

  signingConfigs {
    release {
      // Filled from the environment in CI. Without them the release build is
      // unsigned and the debug build is the one to install. One key across
      // every build is what lets a new APK install over the last one: Android
      // refuses an update that another key signed.
      def store = System.getenv('ANDROID_KEYSTORE_FILE')
      if (store) {
        storeFile file(store)
        storeType 'PKCS12'
        storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
        keyAlias System.getenv('ANDROID_KEY_ALIAS')
        keyPassword System.getenv('ANDROID_KEY_PASSWORD')
      }
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      if (System.getenv('ANDROID_KEYSTORE_FILE')) signingConfig signingConfigs.release
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  packaging {
    // node reads its own files from disk, and the loader maps libnode.so
    // straight out of the APK. Nothing to extract.
    jniLibs { useLegacyPackaging false }
  }
}

// The APK says what it is and which version it is: up-down-the-river-1.2.3.apk.
// A debug build says so too, because it cannot install over a release one.
android.applicationVariants.all { variant ->
  variant.outputs.all { output ->
    def tail = variant.name == 'release' ? '' : "-${variant.name}"
    output.outputFileName = "up-down-the-river-${appVersion}${tail}.apk"
  }
}

// No dependencies at all. The app is two screens and a service, so the
// framework classes are enough, and nothing can drag in a second copy of the
// Kotlin standard library.
dependencies { }
