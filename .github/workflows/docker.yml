name: Docker image

# Builds the container and publishes it to this repository's own registry, so
# a machine that runs the table needs neither the source nor Node installed:
#
#   docker run -p 8787:8787 -e PUBLIC_URL=http://192.168.1.5:8787 \
#     ghcr.io/<owner>/<repo>:latest
#
# main is published as :main, a v* tag as :1.2.3, :1.2, :1 and :latest. A pull
# request is built and smoke tested but never published: nothing from a fork
# should be able to write to the registry.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write            # only to publish, and only on this repository
    steps:
      - uses: actions/checkout@v5

      # The image runs the tests' own server, so it may as well pass them first:
      # a container that cannot deal a hand is not worth publishing.
      - uses: actions/setup-node@v5
        with:
          node-version: 22       # what the image runs
          cache: npm
      - run: npm ci
      - name: Check the server passes its own tests
        run: npm test

      # arm64 as well as amd64: a table often lives on a Raspberry Pi or a small
      # ARM server, and the image is a few files on top of node:alpine.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # Built for this runner first and kept locally, so the image can be
      # started and asked for a page before anybody else is offered it. The
      # layers are cached, so the publish below mostly reuses this.
      - name: Build it for this machine
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start it and ask it for a table
        run: |
          docker run -d --name table -p 8787:8787 "$IMAGE:smoke"
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8787/net.json >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/net.json | grep -q '"port"'
          curl -fsS http://127.0.0.1:8787/ | grep -q 'Join a table'
          curl -fsS http://127.0.0.1:8787/game.js | grep -q 'forbiddenBid'
          curl -fsS http://127.0.0.1:8787/felt.js | grep -q 'const Felt'
          echo "--- the container's own log ---"
          docker logs table
          docker rm -f table

      # Nothing from a pull request is published: a fork's branch must not be
      # able to write to the registry.
      - name: Sign in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build both architectures and publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
